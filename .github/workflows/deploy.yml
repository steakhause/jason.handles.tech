name: Deploy to prod

# Deploys are handled by the n8n CI/CD workflow (GitHub push trigger):
# master -> prod deploy.sh, other branches -> dev mirror deploy-dev.sh.
# Kept as a manual fallback only, so a merge doesn't deploy twice.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}         
          script: |
            bash /home/jason/docker/laravel-sail/jason.handles.tech/deploy.sh
